<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a1d22">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Cláudia Pereira — Exames de Ultrassom. Contatos por WhatsApp.">
    <title>Cláudia Pereira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: linear-gradient(165deg, #151515 0%, #252525 16%, #3d3d3d 34%, #565656 48%, #393939 64%, #1f1f1f 82%, #161616 100%);
            --bg-soft: #1e2228;
            --card: linear-gradient(165deg, #151515 0%, #252525 16%, #3d3d3d 34%, #565656 48%, #393939 64%, #1f1f1f 82%, #161616 100%);;
            --ink: #ffffff;
            --muted: #c8c8c8;
            --color: linear-gradient(500deg, #6f5416 0%, #c9a44a 16%, #d4af37 32%, #d4af37 48%, #a67c2a 62%, #f6df9c 78%, #bf9b30 92%, #7d6118 100%);
            --accent: #cacaca;
            --accent-deep: #8a6a2b;
            --line: #838383;
            --hover: #413c32;
            --shadow: 0 32px 80px rgba(0, 0, 0, 0.48);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            background-color: #101214;
        }

        body {
            min-height: 100vh;
            font-family: "Outfit", system-ui, sans-serif;
            background:
                radial-gradient(ellipse 70% 48% at 16% 10%, rgba(176, 188, 204, 0.09), transparent 58%),
                radial-gradient(ellipse 55% 40% at 86% 88%, rgba(201, 164, 74, 0.07), transparent 52%),
                var(--bg);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
        }

        .page {
            width: 100%;
            max-width: 1080px;
        }

        .brand {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .brand img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }

        .card {
            display: grid;
            grid-template-columns: 0.92fr 1.08fr;
            column-gap: 56px;
            row-gap: 28px;
            align-items: center;
            background: var(--card);
            border: 1px solid rgba(201, 164, 74, 0.22);
            border-radius: 28px;
            padding: 48px 56px;
            box-shadow: var(--shadow);
        }

        .portrait {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        }

        .portrait img {
            width: 100%;
            height: auto;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            object-position: center 18%;
            display: block;
            background: var(--bg-soft);
        }

        .info {
            min-width: 0;
        }

        .eyebrow {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            background-image: var(--color);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .name {
            font-family: "Plus Jakarta Sans", system-ui, sans-serif;
            font-size: 48px;
            font-weight: 500;
            line-height: 1.1;
            letter-spacing: -0.02em;

            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 300;
            color: var(--muted);
            margin-bottom: 32px;
        }

        .divider {
            display: block;
            width: 100%;
            height: 1px;
            border: 0;
            background: var(--color);
            margin: 0 0 28px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link {
            display: grid;
            grid-template-columns: 36px 1fr auto;
            align-items: center;
            gap: 16px;
            min-height: 64px;
            padding: 14px 18px;
            border: 1px solid var(--line);
            border-radius: 14px;
            text-decoration: none;
            color: inherit;
            background: transparent;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .link:hover {
            background: var(--hover);
            border-color: #d4c48a;
            transform: translateY(-1px);
        }

        .link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .index {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .link-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .label {
            font-size: 17px;
            font-weight: 400;
            text-align: left;
        }

        .address {
            font-size: 13px;
            font-weight: 300;
            line-height: 1.35;
            color: var(--muted);
            text-align: left;
        }

        .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: var(--accent);
        }

        .credit {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.04em;
            color: var(--muted);
        }

        .credit a {
            background-image: var(--color);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .credit a:hover {
            -webkit-text-fill-color: var(--accent-deep);
            color: var(--accent-deep);
            text-decoration: underline;
        }

        .credit a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (max-width: 860px) {
            body {
                padding: 32px 20px;
                align-items: flex-start;
            }

            .card {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 12px 12px 28px;
            }

            .portrait {
                width: 100%;
                aspect-ratio: 1 / 1;
                border-radius: 18px;
                box-shadow: none;
            }

            .portrait img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                aspect-ratio: unset;
                object-fit: cover;
                object-position: center 22%;
            }

            .info,
            .credit {
                padding: 0 12px;
            }

            .name {
                font-size: 36px;
            }
        }
    </style>
</head>
